<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="hd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100816" />
      <stop offset="100%" stop-color="#060309" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#hd-bg)" />
  <rect x="1" y="1" width="798" height="448" rx="15" stroke="#1f293d" stroke-width="2" />

  <!-- Header -->
  <rect x="20" y="20" width="760" height="44" rx="10" fill="#140c1e" stroke="#2d1c3e" stroke-width="1.5" />
  <text x="40" y="47" fill="#f43f5e" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">Cardiovascular Risk Prediction Model</text>
  <text x="320" y="46" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">UCI Heart Disease Clinical Dataset • Ensemble Benchmark</text>

  <!-- Left: ROC-AUC Curves and Performance Chart -->
  <g transform="translate(40, 85)">
    <rect width="340" height="330" rx="14" fill="#0c0714" stroke="#2a1738" stroke-width="1.5" />
    <text x="20" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">ROC-AUC COMPARATIVE EVALUATION</text>

    <!-- Axes -->
    <line x1="50" y1="280" x2="300" y2="280" stroke="#475569" stroke-width="1.5" />
    <line x1="50" y1="280" x2="50" y2="70" stroke="#475569" stroke-width="1.5" />
    <line x1="50" y1="280" x2="300" y2="70" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

    <!-- ROC Curve 1: Random Forest -->
    <path d="M50 280 Q 70 120, 160 85 T 300 70" fill="none" stroke="#f43f5e" stroke-width="3" />
    <!-- ROC Curve 2: SVM -->
    <path d="M50 280 Q 90 160, 200 110 T 300 70" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <!-- ROC Curve 3: Logistic Regression -->
    <path d="M50 280 Q 120 190, 220 135 T 300 70" fill="none" stroke="#38bdf8" stroke-width="2" />

    <text x="50" y="305" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">False Positive Rate</text>
    <text x="20" y="60" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">TPR</text>

    <!-- Legend -->
    <rect x="150" y="220" width="140" height="50" rx="6" fill="#140c1e" />
    <text x="160" y="235" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9">Random Forest: 0.91</text>
    <text x="160" y="250" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="9">SVM (RBF): 0.88</text>
    <text x="160" y="265" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">Logistic Reg: 0.84</text>
  </g>

  <!-- Right: Feature Importance Bar Ranking -->
  <g transform="translate(405, 85)">
    <rect width="355" height="330" rx="14" fill="#0c0714" stroke="#2a1738" stroke-width="1.5" />
    <text x="20" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">CLINICAL FEATURE IMPORTANCE RANKING</text>

    <!-- Feature 1: Chest Pain Type -->
    <text x="20" y="70" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">1. Chest Pain Type (cp)</text>
    <rect x="20" y="80" width="280" height="16" rx="4" fill="#f43f5e" opacity="0.8" />
    <text x="310" y="93" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">24.2%</text>

    <!-- Feature 2: Max Heart Rate -->
    <text x="20" y="120" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">2. Max Heart Rate (thalach)</text>
    <rect x="20" y="130" width="240" height="16" rx="4" fill="#e11d48" opacity="0.8" />
    <text x="270" y="143" fill="#e11d48" font-family="'JetBrains Mono', monospace" font-size="10">20.5%</text>

    <!-- Feature 3: ST Depression -->
    <text x="20" y="170" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">3. ST Depression (oldpeak)</text>
    <rect x="20" y="180" width="200" height="16" rx="4" fill="#be123c" opacity="0.8" />
    <text x="230" y="193" fill="#be123c" font-family="'JetBrains Mono', monospace" font-size="10">16.8%</text>

    <!-- Feature 4: Major Vessels -->
    <text x="20" y="220" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">4. Major Fluoroscopy Vessels (ca)</text>
    <rect x="20" y="230" width="160" height="16" rx="4" fill="#9f1239" opacity="0.8" />
    <text x="190" y="243" fill="#9f1239" font-family="'JetBrains Mono', monospace" font-size="10">13.4%</text>

    <!-- Feature 5: Age -->
    <text x="20" y="270" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">5. Patient Age</text>
    <rect x="20" y="280" width="120" height="16" rx="4" fill="#881337" opacity="0.8" />
    <text x="150" y="293" fill="#881337" font-family="'JetBrains Mono', monospace" font-size="10">9.8%</text>
  </g>
</svg>
