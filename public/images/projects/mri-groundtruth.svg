<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#070a13" rx="12" />
  <rect x="1" y="1" width="398" height="298" rx="11" stroke="#1f293d" stroke-width="2" />
  
  <!-- Subtle grid lines -->
  <path d="M40 0V300M80 0V300M120 0V300M160 0V300M200 0V300M240 0V300M280 0V300M360 0V300" stroke="#0f172a" stroke-width="1" />
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400M0 200H400M0 240H400M0 280H400" stroke="#0f172a" stroke-width="1" />

  <!-- Brain background shadow -->
  <ellipse cx="200" cy="145" rx="110" ry="95" fill="#090e1a" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ground Truth Mask -->
  <defs>
    <radialGradient id="gt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4" />
    </radialGradient>
  </defs>
  <ellipse cx="230" cy="120" rx="28" ry="24" fill="url(#gt-glow)" stroke="#34d399" stroke-width="2.5" />
  <path d="M220 105 C 235 100, 255 115, 245 138 C 230 145, 210 135, 220 105 Z" fill="#34d399" opacity="0.6" />

  <!-- Annotation Badge -->
  <rect x="20" y="20" width="195" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="30" y="37" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">GROUND TRUTH MASK</text>

  <!-- Notice -->
  <text x="200" y="270" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="11">Radiologist Annotated Tumor Mask</text>
  <text x="200" y="285" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="9">Research ground truth reference contour</text>
</svg>
