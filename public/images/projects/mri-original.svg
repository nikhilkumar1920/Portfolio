<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#070a13" rx="12" />
  <rect x="1" y="1" width="398" height="298" rx="11" stroke="#1f293d" stroke-width="2" />
  
  <!-- Subtle grid lines -->
  <path d="M40 0V300M80 0V300M120 0V300M160 0V300M200 0V300M240 0V300M280 0V300M320 0V300M360 0V300" stroke="#0f172a" stroke-width="1" />
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400M0 200H400M0 240H400M0 280H400" stroke="#0f172a" stroke-width="1" />

  <!-- Labeled schematic axial MRI brain scan representation -->
  <ellipse cx="200" cy="145" rx="110" ry="95" fill="#0c1222" stroke="#334155" stroke-width="2" />
  <path d="M140 145 C 140 100, 260 100, 260 145 C 260 190, 140 190, 140 145 Z" fill="#131c31" opacity="0.6" />
  
  <!-- Ventricles and anatomical fissures (schematic placeholder) -->
  <path d="M190 125 C 190 135, 185 145, 175 155" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <path d="M210 125 C 210 135, 215 145, 225 155" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <ellipse cx="230" cy="120" rx="22" ry="18" fill="#1e293b" stroke="#64748b" stroke-dasharray="3 3" />

  <!-- Annotation Badge -->
  <rect x="20" y="20" width="160" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="30" y="37" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">INPUT: MRI (T1ce)</text>

  <!-- Notice -->
  <text x="200" y="270" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Schematic MRI Anatomical Input Placeholder</text>
  <text x="200" y="285" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="9">Replace with research sample in public/images/projects/mri-original.png</text>
</svg>
