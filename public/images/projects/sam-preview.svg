<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="sam-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a16" />
      <stop offset="100%" stop-color="#030409" />
    </linearGradient>
    <radialGradient id="mri-brain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141f36" />
      <stop offset="60%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>
    <radialGradient id="tumor-core" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#sam-bg)" />
  <rect x="1" y="1" width="798" height="448" rx="15" stroke="#1f293d" stroke-width="2" />

  <!-- Header -->
  <rect x="20" y="20" width="760" height="44" rx="10" fill="#0b1122" stroke="#25324d" stroke-width="1.5" />
  <text x="40" y="47" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">SAM-ViT-B Domain Adaptation</text>
  <text x="260" y="46" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">| Multi-Modal Glioma Segmentation Pipeline</text>
  <rect x="630" y="30" width="135" height="24" rx="6" fill="#1e1035" stroke="#8b5cf6" stroke-width="1" />
  <text x="697" y="46" text-anchor="middle" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">SPRINGER CVR '26</text>

  <!-- Left: MRI Scan Visualization with Segmented Contours -->
  <g transform="translate(40, 85)">
    <rect width="340" height="330" rx="14" fill="#060913" stroke="#22304d" stroke-width="1.5" />
    <text x="20" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">AXIAL T1ce / FLAIR MULTI-MODAL MRI</text>

    <!-- Brain Contours -->
    <ellipse cx="170" cy="180" rx="125" ry="110" fill="url(#mri-brain)" stroke="#334155" stroke-width="1.5" />
    <path d="M110 180 C 110 120, 230 120, 230 180 C 230 240, 110 240, 110 180 Z" fill="#0e182e" opacity="0.6" />
    <path d="M150 150 C 150 170, 145 185, 135 200" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <path d="M190 150 C 190 170, 195 185, 205 200" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

    <!-- Glioma Tumor Segment Mask with High Dice Overlap -->
    <ellipse cx="205" cy="145" rx="35" ry="30" fill="url(#tumor-core)" stroke="#22d3ee" stroke-width="2.5" />
    <ellipse cx="205" cy="145" rx="33" ry="28" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 2" />

    <!-- Bounding Box Prompt Overlay -->
    <rect x="160" y="105" width="90" height="80" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" />
    <rect x="160" y="93" width="70" height="15" rx="2" fill="#f59e0b" />
    <text x="165" y="104" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">PROMPT BOX</text>

    <text x="20" y="315" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">Ground Truth Overlap: 98.64%</text>
  </g>

  <!-- Right: Technical Architecture & Metrics Cards -->
  <g transform="translate(405, 85)">
    <!-- Metrics Grid -->
    <rect width="355" height="145" rx="14" fill="#0b1122" stroke="#1e293d" stroke-width="1.5" />
    <text x="20" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">EXPERIMENTAL TEST EVALUATION RESULTS</text>

    <!-- Metric 1: Dice -->
    <g transform="translate(20, 42)">
      <rect width="95" height="80" rx="10" fill="#13102c" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="47" y="35" text-anchor="middle" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">0.9864</text>
      <text x="47" y="55" text-anchor="middle" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10">Dice Score</text>
      <text x="47" y="70" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">+14.6% vs U-Net++</text>
    </g>

    <!-- Metric 2: IoU -->
    <g transform="translate(130, 42)">
      <rect width="95" height="80" rx="10" fill="#082535" stroke="#06b6d4" stroke-width="1.5" />
      <text x="47" y="35" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">0.9733</text>
      <text x="47" y="55" text-anchor="middle" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10">IoU (Jaccard)</text>
      <text x="47" y="70" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">Near-Optimal</text>
    </g>

    <!-- Metric 3: Pixel Accuracy -->
    <g transform="translate(240, 42)">
      <rect width="95" height="80" rx="10" fill="#092823" stroke="#10b981" stroke-width="1.5" />
      <text x="47" y="35" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">99.93%</text>
      <text x="47" y="55" text-anchor="middle" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10">Pixel Acc.</text>
      <text x="47" y="70" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">Benchmark</text>
    </g>

    <!-- Architecture & Adapters Breakdown -->
    <g transform="translate(0, 160)">
      <rect width="355" height="170" rx="14" fill="#080d1a" stroke="#1f2c47" stroke-width="1.5" />
      <text x="20" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">MODEL ADAPTATION ARCHITECTURE</text>

      <rect x="20" y="40" width="315" height="28" rx="6" fill="#131c33" stroke="#334155" stroke-width="1" />
      <text x="32" y="58" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">ViT-B Image Encoder (Prompt-Free Adapter)</text>

      <rect x="20" y="75" width="315" height="28" rx="6" fill="#1a1538" stroke="#8b5cf6" stroke-width="1" />
      <text x="32" y="93" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">Domain Adapter MLP &amp; Skip Connection</text>

      <rect x="20" y="110" width="315" height="28" rx="6" fill="#0c2333" stroke="#06b6d4" stroke-width="1" />
      <text x="32" y="128" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Lightweight Mask Decoder + Dice Loss</text>

      <text x="20" y="156" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="10">* Evaluated on academic research MRI split</text>
    </g>
  </g>
</svg>
